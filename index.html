<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Keanggotaan LDM</title>
  <!-- Tailwind CSS via CDN untuk styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-sans selection:bg-[#00804c] selection:text-white">

  <!-- Main Card Container -->
  <div class="w-full max-w-sm bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-gray-200">
    
    <!-- Bagian Header (Dominan Hijau 00804c) -->
    <div class="bg-[#00804c] relative pt-8 pb-20 px-6 text-center shadow-inner">
       
       <!-- Ruang untuk Logo -->
       <!-- Ganti tag <span> dengan tag <img> untuk logo asli -->
       <div class="w-16 h-16 mx-auto bg-white rounded-full flex items-center justify-center shadow-lg mb-3 border-2 border-white/50 p-1">
         <img src="ldm+trans.png" alt="Logo" class="w-full h-full object-contain">
         <!-- Contoh img: <img src="link-logo.png" alt="Logo" class="w-full h-full object-contain"> -->
       </div>
       
       <h1 class="text-white font-bold text-lg tracking-wide uppercase drop-shadow-md">Lembaga Dakwah Mahasiswa</h1>
       <p class="text-emerald-100/80 text-xs font-medium mt-1">UIN Sunan Gunung Djati Bandung</p>
    </div>

    <!-- Bagian Konten Profil (Desain Overlapping / Menumpuk ke atas) -->
    <div class="px-6 pb-8 relative -mt-14">
       
       <!-- Foto Anggota -->
       <div class="w-28 h-28 mx-auto bg-white rounded-full p-1.5 shadow-xl relative z-10">
         <img id="foto" src="https://via.placeholder.com/150" alt="Foto Anggota" class="w-full h-full rounded-full object-cover border-4 border-[#00804c]">
         
         <!-- Ikon Ceklis (Verifikasi) Kecil di sudut foto -->
         <div class="absolute bottom-1 right-1 bg-white rounded-full p-0.5 shadow-md">
            <div class="bg-[#00804c] text-white rounded-full w-6 h-6 flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
         </div>
       </div>

       <!-- Nama & Status -->
       <div class="text-center mt-4 mb-6">
         <h2 id="nama" class="text-2xl font-extrabold text-gray-800">Bilal Ahmad</h2>
         <div class="mt-2 inline-flex items-center px-4 py-1.5 rounded-full bg-[#00804c]/10 border border-[#00804c]/20 text-[#00804c] text-xs font-bold tracking-widest uppercase">
           <span id="status">Anggota Aktif</span>
         </div>
       </div>

       <!-- Kartu Detail Data -->
       <div class="bg-gray-50 rounded-2xl p-5 border border-gray-100 shadow-sm space-y-4">

         <!-- Detail: NIM -->
         <div class="flex flex-col">
           <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-0.5">NIM</span>
           <span id="nim" class="text-gray-800 font-semibold text-sm">1239210004</span>
         </div>
         
         <div class="h-px w-full bg-gray-200"></div>

         <!-- Detail: Fakultas -->
         <div class="flex flex-col">
           <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-0.5">Fakultas</span>
           <span id="fakultas" class="text-gray-800 font-semibold text-sm">Ekonomi dan Bisnis Islam</span>
         </div>
         
         <div class="h-px w-full bg-gray-200"></div>

         <!-- Detail: Jurusan -->
         <div class="flex flex-col">
           <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-0.5">Jurusan</span>
           <span id="jurusan" class="text-[#00804c] font-bold text-sm">Akuntansi Syariah</span>
         </div>

         <div class="h-px w-full bg-gray-200"></div>

         <!-- Detail: Angkatan -->
         <div class="flex flex-col">
           <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-0.5">Angkatan</span>
           <span id="angkatan" class="text-gray-800 font-semibold text-sm">2023</span>
         </div>
       </div>

       <!-- Footer/Info -->
       <div class="mt-6 text-center text-[10px] text-gray-400 font-medium">
         <p>Data profil terintegrasi dengan<br>Sistem Informasi LDM UIN SGD Bandung</p>
       </div>
       
    </div>
  </div>
  <script>
    // URL API dari Google Apps Script kamu
    const API_URL = 'https://script.google.com/macros/s/AKfycbw7wNaR3xfdY2i8FVjejgolZ0gWtSvZ7szwjOELMqR2nG3mqctUiWp_ihnl_UUyECk9/exec';
    
    // Ambil '?id=' dari URL saat QR di-scan
    const params = new URLSearchParams(window.location.search);
    const idAnggota = params.get('id');
  
    if(idAnggota) {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          // Cari data yang ID-nya sama dengan yang di-scan
          const profil = data.find(item => item.id == idAnggota);
          
          if(profil) {
            // Suntikkan data dari spreadsheet ke HTML
            document.getElementById('nama').innerText = profil.nama;
            document.getElementById('nim').innerText = profil.nim;
            document.getElementById('fakultas').innerText = profil.fakultas;
            document.getElementById('jurusan').innerText = profil.jurusan;
            document.getElementById('angkatan').innerText = profil.angkatan;
            document.getElementById('status').innerText = profil.status;
            document.getElementById('foto').src = profil.foto;
          }
        });
    }
  </script>
</body>
</html>
